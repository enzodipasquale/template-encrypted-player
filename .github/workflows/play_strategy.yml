name: Play turn

on:
  repository_dispatch:
    types: [play-game]
  workflow_dispatch: {}

env:
  SERVER_URL: ${{ vars.SERVER_URL }}
  TOURNAMENT_SLUG: ${{ vars.TOURNAMENT_SLUG }}

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        # Persists your local history cache between turns; if GitHub evicts
        # it, runner.py re-fetches your full history from the server.
        uses: actions/cache@v4
        with:
          path: .ubx_history.json
          key: ubx-history-${{ github.run_id }}
          restore-keys: |
            ubx-history-

      - name: Run strategy
        env:
          GAME_TOKEN: ${{ secrets.GAME_TOKEN }}
          PLAYER_NAME: ${{ secrets.PLAYER_NAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python runner.py run
