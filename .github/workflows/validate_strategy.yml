name: Validate strategy

on:
  workflow_dispatch: {}
  push:
    paths:
      - "strategy.py.encrypted"
      - "runner.py"
      - "requirements.txt"

env:
  SERVER_URL: ${{ vars.SERVER_URL }}
  TOURNAMENT_SLUG: ${{ vars.TOURNAMENT_SLUG }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python runner.py validate --game penalty_shootout
